name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Plain `gem install`, not Bundler - see docs/mobile-plan.md's Task 10
      # ledger entry for why (a local-only Bundler version mismatch on the
      # dev Mac; doesn't apply here, but this keeps the two environments
      # using the same install mechanism rather than two different ones).
      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build both flavors and upload to TestFlight
        working-directory: tools
        run: fastlane ios ci_release
