name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'tools/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      # The project was last saved by Xcode 27 (LastUpgradeCheck = 2700) -
      # pin to the newest Xcode the runner offers so the archive step doesn't
      # hit an SDK/project-format mismatch against an older default.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Plain `gem install`, not Bundler - this Mac's local `bundle`
      # executable turned out to be a stale leftover from a previous
      # Homebrew Ruby version (unrelated to this repo), and switching both
      # environments to the same plain-gem install keeps local dev and CI
      # using one mechanism instead of two.
      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build both flavors and upload to TestFlight
        working-directory: tools
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: fastlane ios ci_release
