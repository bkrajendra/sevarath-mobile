name: Tag Release

# Makes pubspec.yaml's `version:` the single source of truth for releases.
# Every push to main checks whether the version changed; if so, it creates
# and pushes the matching vX.Y.Z tag, which release.yml picks up to build
# and publish the signed APKs. A no-op on commits that don't bump the version.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag from pubspec.yaml version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*//' | cut -d'+' -f1)
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from pubspec.yaml" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
